# This repo's CI. Job `ci` is the 1 required check; it always reports.
# 1 job, so 1 billed minute floor per run: the kit's checks (./checks), the docs ratchet, then
# tests/run.sh unless the change is docs only. A draft PR runs no job; marking it ready runs it.
# The triggers have no path filter, so `ci` reports on every PR; the decide step skips the tests.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./checks
      - id: decide
        if: github.event.action != 'edited'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          code=true
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ "$EVENT" = push ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          if [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                plugin/*|AGENTS-AND-MODELS.md|codex/*) code=true ;;   # these ship; the pin test reads them
                *.md|docs/*|.claude/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "Decision: code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Docs ratchet
        if: github.event.action != 'edited'
        run: |
          bad=$(git ls-files | grep -E '^docs/|(^|/)CHANGELOG' || true)
          bad="$bad
          $(git ls-files '*.md' | grep -vE '^(README|CLAUDE|AGENTS|AGENTS-AND-MODELS)\.md$|^codex/AGENTS\.md$|^plugin/|^tests/fixtures/' || true)"
          bad=$(echo "$bad" | sed '/^$/d')
          if [ -n "$bad" ]; then echo "Not allowed (docs go in the wiki):"; echo "$bad"; exit 1; fi
      - name: tests/run.sh
        if: steps.decide.outputs.code == 'true'
        run: sh tests/run.sh
      - name: Docs only
        if: github.event.action != 'edited' && steps.decide.outputs.code != 'true'
        run: echo "Docs-only change; tests/run.sh skipped."
