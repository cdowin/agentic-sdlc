# GENERATED by agentic-sdlc — `agentic-sdlc install-ci`.
#
# Asks one question: is the PR's version (read out of VERSION_FILE) greater than
# main's? Numeric components, left to right, a missing one is 0; no PM tree is read.
# After this file is written it is YOURS: edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: Semver Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# --- project config ----------------------------------------------------------
# `install-ci` renders both lines below from `[pm] version_file` in devkit.toml
# (bash has no TOML reader, so the file is named twice; `adopt` fails when the
# two part). VERSION_PATTERN comes from the file's NAME — pyproject.toml,
# Cargo.toml, package.json or VERSION — else from `[pm] version_pattern` when
# that is also a POSIX ERE; otherwise install-ci refuses and the file is yours
# to write. The pattern is a POSIX extended regex with ONE capture group,
# applied as `sed -n -E "s#<pattern>#\1#p"`, so it may not contain `#`.
env:
  VERSION_FILE: pyproject.toml
  VERSION_PATTERN: '^version[[:space:]]*=[[:space:]]*"([^"]+)".*$'

jobs:
  check-version:
    name: Version must increase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract versions
        id: versions
        run: |
          read_version() { sed -n -E "s#${VERSION_PATTERN}#\1#p" | head -1; }

          # The PR side refuses: a gate comparing "" to "" would wave every PR through.
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::Could not read a version on the PR branch: VERSION_FILE='$VERSION_FILE' does not exist. Set [pm] version_file in devkit.toml and re-run install-ci --force."
            exit 1
          fi
          PR_VERSION=$(read_version < "$VERSION_FILE")
          if [ -z "$PR_VERSION" ]; then
            echo "::error::Could not read a version from '$VERSION_FILE' on the PR branch: VERSION_PATTERN='$VERSION_PATTERN' matched no line. Fix VERSION_FILE / VERSION_PATTERN at the head of this workflow."
            exit 1
          fi

          git fetch origin main
          # Main's copy may not exist yet (the first versioned merge): the compare
          # step warns. A copy that exists but matches no line refuses there.
          MAIN_FILE=absent
          if git cat-file -e "origin/main:$VERSION_FILE" 2>/dev/null; then MAIN_FILE=present; fi
          MAIN_VERSION=$(git show "origin/main:$VERSION_FILE" 2>/dev/null | read_version)
          echo "pr_version=$PR_VERSION" >> "$GITHUB_OUTPUT"
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "main_file=$MAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "PR version: $PR_VERSION (from $VERSION_FILE)"
          echo "Main version: ${MAIN_VERSION:-<none on main yet>}"

      - name: Compare versions
        env:
          PR: ${{ steps.versions.outputs.pr_version }}
          MAIN: ${{ steps.versions.outputs.main_version }}
          MAIN_FILE: ${{ steps.versions.outputs.main_file }}
        run: |
          if [ -z "$PR" ]; then
            echo "::error::Could not read a version from '${VERSION_FILE:-the version file}' on the PR branch: VERSION_PATTERN='${VERSION_PATTERN:-unset}' matched no line."
            exit 1
          fi

          # Only a version file ABSENT on main allows; one present that the pattern
          # cannot read refuses, else every PR would pass.
          if [ -z "$MAIN" ] && [ "$MAIN_FILE" = absent ]; then
            echo "::warning::No version in '${VERSION_FILE:-the version file}' on main yet — first versioned merge. Allowing."
            exit 0
          fi
          if [ -z "$MAIN" ]; then
            echo "::error::Could not read a version from '${VERSION_FILE:-the version file}' on main: VERSION_PATTERN='${VERSION_PATTERN:-unset}' matched no line on main. Fix VERSION_FILE / VERSION_PATTERN at the head of this workflow."
            exit 1
          fi

          # Component-wise, any length; a missing component is 0; non-numeric refuses.
          IFS='.' read -r -a PR_PARTS <<< "$PR"
          IFS='.' read -r -a MAIN_PARTS <<< "$MAIN"
          n=${#PR_PARTS[@]}; [ "${#MAIN_PARTS[@]}" -gt "$n" ] && n=${#MAIN_PARTS[@]}
          verdict=equal
          for ((i = 0; i < n; i++)); do
            p="${PR_PARTS[i]:-0}"; m="${MAIN_PARTS[i]:-0}"
            case "$p$m" in *[!0-9]*)
              echo "::error::Non-numeric version component — main is '$MAIN', PR is '$PR'. Versions are dotted integers only."
              exit 1;;
            esac
            if [ "$p" -gt "$m" ]; then verdict=greater; break
            elif [ "$p" -lt "$m" ]; then verdict=less; break; fi
          done
          if [ "$verdict" != greater ]; then
            echo "::error::Version must increase. Main is $MAIN, PR is $PR. Bump the version in ${VERSION_FILE:-the version file} before merging."
            exit 1
          fi

          echo "Version bump OK: $MAIN -> $PR"
