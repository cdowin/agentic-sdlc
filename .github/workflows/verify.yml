# GENERATED by agentic-sdlc — `agentic-sdlc install-ci`.
#
# Three jobs. `verify` checks out, ARMS the checkout and runs this project's
# full gate. It assumes `make milestone` is that gate; a project without the
# target gets a red step naming it. `python` runs the story rung on every
# interpreter past the floor, one runner each, at the same time as `verify`;
# it acts only where a pyproject.toml is tracked, and `verify` then leaves the
# `matrix` tier out (GDK_MILESTONE_SKIP), so no suite runs twice. `matrix` is
# the one check that answers for every leg, so a ruleset can require it by a
# name that does not change when the interpreter list does. Your toolchain is
# yours to add below, guarded on a tracked file that only exists where it is
# wanted, the way the arming step is. After this file is written it is YOURS:
# edit it here; re-installing needs --force, and `--diff` shows what a
# re-install would change.
#
# CI is the one confirmation at merge: the hooks and belts already run the
# gates on every commit, so this runs once per pull request into main, not
# again on the push that merges it. There is no `paths-ignore`, because a
# REQUIRED check that is skipped blocks the merge. By design, nothing
# re-verifies the merge commit: the check ran on the pull request's tree, and
# the ruleset's `strict` is false, so main may move after that run.
name: verify

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to the same pull request cancels the run it makes stale.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The PM and doc gates read worktrees, branches and tracked files.
          fetch-depth: 0
      - name: Arm the tracked git hooks
        # `core.hooksPath` is repo-local config a fresh checkout never has.
        if: hashFiles('tools/setup-hooks.sh') != ''
        run: bash tools/setup-hooks.sh
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the pinned shellcheck
        # `[shell] shellcheck_version` pins the shellcheck `check shell` may
        # run; this installs that release, so a local pass is a CI pass. The
        # pin is read through the tool (`check shell --pin`); unset, it prints
        # an empty line and this step installs nothing.
        if: hashFiles('devkit.toml') != ''
        run: |
          pin="$(make -s sdlc ARGS='check shell --pin')"
          if [ -n "$pin" ]; then
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${pin}/shellcheck-v${pin}.linux.x86_64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/shellcheck-v${pin}" >> "$GITHUB_PATH"
          fi
      # --- your toolchain goes here -----------------------------------------
      #   - name: Install the linters this project's gate shells out to
      #     if: hashFiles('<a file only this kind of project has>') != ''
      #     run: |
      #       uv tool install "<linter>"
      #       sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # ----------------------------------------------------------------------
      - name: make milestone
        # CI has no second look, so the gates stream. The `python` job below
        # runs the interpreter matrix, so this run leaves it out.
        env:
          VERBOSE: "1"
          GDK_MILESTONE_SKIP: ${{ hashFiles('pyproject.toml') != '' && 'matrix' || '' }}
        run: make milestone
      - name: keep the gate transcripts of a red run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: .gate-reports/
          if-no-files-found: ignore
          retention-days: 3

  python:
    # One leg per interpreter PAST the floor; `verify` runs the floor. Edit the
    # list when your floor or your claimed interpreters move: `matrix` below is
    # the required check, so the ruleset does not change with it.
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: the story rung on python ${{ matrix.python }}
        # `[verify] story` in devkit.toml names the rung (`make unit`, say);
        # UV_PYTHON is the interpreter every `uv run` under it resolves.
        if: hashFiles('pyproject.toml') != ''
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make sdlc ARGS='verify --story --no-cache'

  matrix:
    # The one check that answers for every leg: a leg's own check carries its
    # interpreter in its name, which is not a name a ruleset can keep.
    needs: python
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every interpreter leg passed
        run: |
          echo "the python legs: ${{ needs.python.result }}"
          test "${{ needs.python.result }}" = success
