# agentic-sdlc's config for agentic-sdlc. The toolkit runs its own gates on its
# own tree: a gate nobody points at its author is a gate nobody has tested at
# the one place its defects are cheapest to find.
#
# Everything here is a SCOPE or an APPLICABILITY statement. Nothing weakens a
# rule, and nothing is a fork — rule 5 is that per-project variation lives in
# this file, and this file is the proof it can.

[checks]
# The roster `check all` runs HERE. The stock default is `doc` + `shell` — the
# two that apply to any repo — and this file adds the ones the stock roster
# leaves off for reasons that do not hold here.
#
# `pm` is stock-OFF because it would fail a consumer for having no PM tree at
# all. This tree IS one, self-hosted, so the gate is pointed at its author.
#
# `repo-hygiene` is the one known gate this file still leaves out: it hits the
# network and belongs at milestone close, not inside every `make check`.
#
# `hooks` is the other half of that self-hosting, and it is here because the
# sentence was not enough: `core.hooksPath` was unset in every checkout of this
# repo for two releases while CLAUDE.md said the corpus was armed, and no target
# looked. It is stock-OFF for consumers — arming is a decision each makes once —
# and on for the repo that told them to.
#
# `grain-shape` is stock-ON (0.2.0) and is named here for the same reason
# `shell` is: an explicit roster does not inherit the stock default, so a gate
# this file forgets is a gate this repo — the one that ships it — never runs on
# itself. Self-hosting is the proof that the caps it ships are caps real grains
# written by several hands can meet.
all = ["doc", "grain-shape", "pm", "shell", "hooks"]

[grain_shape]
# Story 09 of 0.2.0/the-code-knows-entry-and-exit removes this once this tree's records are trimmed to the stock caps.
caps = { story = 200, feature = 210, bug = 150, milestone = 210, decisions = 500, review = 450 }

# No scope section is set for the gates above. The deliberately-drifted trees
# under tests/fixtures/ are the INPUT to this package's tests, not content this
# repo maintains — but every gate still on the roster is pointed at markdown,
# shell, git or the PM tree, and none of them walks that directory, so there is
# nothing left here to carve out. The three `exclude_prefixes` sections that did
# the carving left with the gates that read them (0.2.0).

[doc]
# Every human- and agent-facing surface, not only the always-loaded ones: the
# README, the SDLC, the design docs, the rules, the roster and the skills all
# make `make <target>` and file-path claims against this tree, and a claim
# nobody checks is a claim that goes dead. Stock scope is the three always-
# loaded globs; this repo holds all of its prose to the same gate.
scope = [
    "CLAUDE.md", "README.md", "SDLC.md", "docs/*.md",
    ".claude/rules/*.md", ".claude/agents/*.md", ".claude/skills/*/SKILL.md",
]

[pm]
# Everything opt-in except D8. The rules this package ships OFF by default are
# off because a consumer's legacy tree would go red on upgrade day — this tree
# has no legacy, so it takes all of them and stays inside them from entry one.
#
# D8 was the one rule that did not apply here: it welded the project version to
# the id of whichever milestone was in progress, which encodes bump-at-START,
# and this package bumps at CLOSE. R5 replaced it in 0.3.0 and the rule now
# fits, because `version_at` says WHICH entry in the plan the version file is
# graded against — `ship`, the last one that has shipped, is bump-at-close. So
# the rule this repo could not run on itself is on, which is the point of
# self-hosting: a gate nobody points at its author is a gate nobody has tested.
#
# R1-R4 and R6 are the release family, and R6 caught this tree's own 0.1.0 on
# its first run: shipped inside v0.2.0, record saying `planning` ever since.
# U1 reports a declared state no grain has ever held, and it is telling the
# truth about its author — this package holds 3 of its 8 milestone states.
#
# D9 and D10 DO apply: work happens on `milestone/<id>` (SDLC.md §1), main is
# merge-commit-only at close, and D3 (0.16.0) is the decision that caught this
# tree working on main while telling its consumers not to — D10 is what stops
# that recurring silently.
#
# D11 is on because this tree is the one it was written for: the telemetry
# recorded NOTHING for the whole of 0.3.0 with the hooks installed, executable,
# self-testing and firing. A courier fails open by design, so the only thing
# that can say so is a gate somebody reads.
checks = [
    "D1", "D2", "D4", "D5", "D6", "D11", "D12",
    "D9", "D10",
    "U1", "U2", "U3", "U4", "U5",
    "R1", "R2", "R3", "R4", "R5", "R6",
    "V1", "V4", "V5", "V7",
]

# R5 grades pyproject.toml against a POSITION in pm/roadmap/releases.md `order`,
# and this is the key that says which position. `ship` is bump-at-CLOSE — the
# LAST entry that has shipped — which is this repo's flow: the version moves in
# the release commit, so while 0.3.0 is building the file correctly still reads
# 0.2.0. `start` (the default, and what `pm init` seeds) is bump-at-START, which
# is what most consumers do and what D8 used to assume for everyone.
version_at = "ship"

[tests]
# THE CEILINGS, and they are ours rather than the package's. `check budget`
# ships with none — "twenty seconds" is a claim about a machine, and rule 8
# says this package knows nothing about the machines its consumers run on — so
# a tree that declares nothing gets its costs reported and exit 0.
#
# Measured 2026-09-06 on the floor interpreter, off the verdict lines in
# .gate-reports/unit.log and test.log: unit 8.2 s in one process, both tiers
# 100.6 s on eight workers.
# The ceilings are roughly 2x each, because a shared CI runner is not a laptop
# and a gate that goes red on a busy afternoon is a gate somebody deletes.
#
# NOT IN `[checks] all`, and that is a ruling rather than an oversight.
# `check all` is the PER-CHANGE gate: it runs in `precommit`, in a pre-push
# hook, and inside `test_makefile_gates`, which spawns `make check` against
# this very tree. A budget gate there grades the LAST suite run, so one slow
# afternoon reddens the next person's edit for a reason they cannot act on —
# and it made nine tests fail for a timing number that had nothing to do with
# what they assert. A gate that reddens on somebody else's clock is milestone
# risk 2 with a stopwatch, and it is the kind that gets deleted.
#
# It runs in `make milestone`, once, where a regression is a thing to act on.
#
# They exist to catch a DOUBLING, not a wobble. The drift this is aimed at is
# the one that already happened here: 240 s of suite, arrived at one honest
# fixture at a time, with every gate green the whole way down.
budget = { unit = 20, integration = 130, test = 150 }

# AND A CEILING ON SIZE, which the duration cannot see. A tier holds its wall
# clock while doubling in case count — parallelism and a faster machine both
# absorb it — and the number that then goes wrong is the reader's, not the
# gate's. Measured 2026-09-06: 706 unit and 389 integration (1,095 in `test`).
#
# Set ~10% above the counts they were written against, because the point is to
# make GROWTH a decision somebody argues rather than one that happens.
#
# RAISED at the close of 0.4.0, and this is that argument. The unit tier went
# 706 -> 845 (+139, +20%) and the gate caught it, which is the gate working.
# The growth was concentrated in five modules and every case in it pinned a
# defect that HAPPENED or a verb that shipped:
#
#   test_pm_gate    +17  V7, the unbound census, the five descent holes, the
#                        stray document, `[pm.contains]` ungating a finding,
#                        and a V5 cycle a flat-id tree could not see
#   test_pm_order   +13  `pm add`/`pm remove` and five retirements by name
#   test_pm_rename  +10  a new verb, whole
#   test_cli_surface +7  the read-verb surface rules
#   test_config_seed +5  the seed held to the code, which found seven drifts
#
# RAISED AGAIN 2026-09-07, at the close of 0.5.0, and this is that argument.
# 845 -> 1028 (+183, +22%), and MORE THAN A THIRD of it is three modules this
# milestone's new capabilities did not previously have at all:
#
#   test_verify_cache      +32  `verify` remembering its last green — a new
#                               cache with an invalidation rule, which is the
#                               class of thing that is wrong silently
#   test_conveyor_lessons  +30  the lesson verb and where a lesson surfaces
#   test_pm_gate           +22  U5, and the U2/U3/U4 recording family
#   test_pm_verbs          +17  the arrival: the fork, the disposition, the
#                               capability census, the derived breadcrumb
#   test_pm_ledger         +15  the arrival's row grammar and the three taps
#   test_pm_migrate         +5  a new verb, whole
#   test_emit               +4  the emit seam, which boots nothing (rule 2)
#
# The rest is one or two cases per module, each one a MAJOR from this
# milestone's four review records: the no-op that shadowed a recorded answer,
# the belt that reflowed the fork it printed, the arrival row dropped with no
# disclosure, the level an id names. That is rule 10 being obeyed, not bloat —
# so the ceiling moves to fit the suite that exists, once, with the reason
# written down. It does not move again without one.
#
# RAISED AGAIN 2026-09-08, at the close of 0.6.0, and this is that argument.
# 1028 -> 1132 (+104, +10%) — a third of the previous rise, on a milestone that
# shipped two verbs and three new gates. The gate caught it at +2 over the
# ceiling on the LAST commit before the release belt, which is the gate working
# at exactly the resolution it was set for.
#
#   test_contracts     +22  the shared-surface registry: every vocabulary
#                           round-tripped from its writer to its reader, which
#                           is the pair four of 0.5.0's blockers were
#   test_guard_corpus  +12  the corpus harness itself, and it carries one
#   test_pm_gate       +12  U4's age, U5 narrowed to states that ask something
#   test_pm_remote     +11  the remote reader, which reads refs and never spawns
#   test_dispatch      +11  a new verb, whole, plus the ledger lines it renders
#   test_pm_changelog   +8  a new verb, whole
#   test_check_doc      +8  the module this gate never had, and B1's wiring case
#   test_check_hooks    +5  the cc-* arming half `core.hooksPath` never covered
#
# FOUR of them exist because a gate could not fail: the router read by AST,
# `semver-gate.yml`'s success path, an `assertIn(x, X)` tautology, and
# `check doc`'s rule wired by one unguarded line. Each pins a defect that
# HAPPENED in this milestone and was watched failing before it was fixed.
#
# RESTRUCTURED 2026-09-10, at 0.7.0, and this is that argument. The ceiling is
# now on the SUITE — the `test` tier, which runs both halves and files one
# census — and NOT per tier. Two measurements forced it:
#
#   1. A PER-TIER COUNT MEASURES TIER MEMBERSHIP, NOT GROWTH. 0.7.0 moved 62
#      cases from `integration` to `unit` by deleting a dead `import
#      subprocess` and one `git_tree as tree` alias. Nothing was written and
#      nothing was deleted. The suite went 1,571 -> 1,586 collected, real
#      growth of 15 — and the unit ceiling read +72 over while the integration
#      one gained 56 of headroom. A gate that reddens hardest when the tier
#      boundary is CORRECTED teaches people not to correct it.
#
#   2. THE CLOCK CANNOT REPLACE IT, which is why the count does not simply go.
#      `unit` went 706 -> 1,212 cases, +72%, for 8.2s -> 9.6s, +17%: xdist
#      absorbs the rest. A tier really can double in size inside its time
#      budget, exactly as the note above said in 0.4.0. So: time per TIER,
#      because that is what a human waits for and it differs per tier; count
#      per SUITE, because that is what grows and it does not care which side
#      of the mark a case sits on.
#
# `test` is the whole suite in one run (`$(PYTEST) $(PYTEST_N)`, no `-m`), so
# its census is the number, and `GDK_MILESTONE_TIERS` runs it — a limit graded
# from a measurement the gate does not take is the hole
# `bg-an-uncounted-tier-passes-the-case-ceiling` records.
#
# RE-SET AT 0.7.0's CLOSE, 2026-09-11: 1,575 -> 1,627. The suite went 1,571
# collected at `main` to 1,627 here, +56 over a milestone whose whole point was
# moving code without changing behaviour — so every one of the 56 is a GATE, not
# a behaviour case, and each is named in the story or bug close that added it.
# The three that carry most of it:
#
#   primitive 12  NoNameIsBoundTwice           1 case + 14 replayed CORPUS rows
#   primitive 13  EveryModuleSaysWhatItDoes    1 case + a 10-row CORPUS
#   the section roster + the comparison        15, over `pm ledger report`
#
# Plus the by-id census derived rather than hand-kept (2), the aliased-owner
# case (1), and the rest spread one and two at a time. Three primitives arrived
# that 0.7.0's feature briefs did not price — the feature review's F7 is that
# finding, and the budget paragraph under
# `ft-the-module-says-what-it-does`'s `## Proof budget` carries the argument.
#
# 1,627 is the suite that exists today, with no headroom on purpose: growth is
# meant to be argued, not absorbed. Re-set at each close, once, with a reason.
#
# RE-SET at the close of 0.8.0: 1,627 -> 1,696 (+69, +4.2%). Every case added
# failed at HEAD before its fix. Measured per module against a `git archive
# 4dae916` copy:
#
#   test_install_sdlc  +27  ONE parametrised case holding all 23 belt
#                           descriptions to what their checks read, plus 4
#                           planted falsehoods (#33 had no such guard)
#   test_install       +12  [adopt] ours claims, the header carry, the markdown
#                           fence (D2), the withdrawal census, the citation
#                           census through the stock wiring (#20 #21 #22)
#   test_pm_gate        +6  the ROSTER line, the retired field ungated, U1 over
#                           the ledger, the help roster, the CLOSE WARN
#   test_check_doc      +6  spans across a paragraph, backtick pairing,
#                           blockquotes, wrapper words, quoted prose (#26)
#   test_host_guard     +3  the suite scrubs git's env and holds the host still
#   + 15 more, one or two each, across 8 modules
#
# Integration wall clock is unchanged (paired same-machine runs: v0.7.0 49-51s,
# 0.8.0 50-52s; the milestone review's R11).
cases = { test = 1696 }
# Nothing else is set. The prose ratchets, their six line caps and their three
# grandfather ledgers were deleted in 0.15.0, and every key they read is now
# named at exit 2 by `check pm` — so this file declares scope and roster, and
# says nothing about the length of anybody's markdown.

# --- THE FLOW, and it is this project's rather than the tool's ----------------
# Written by `agentic-sdlc pm init`, read every run, never assumed. This is the
# section hard rule 5 splits on: a GATE ships stock defaults and a repo with no
# devkit.toml runs every gate byte-identically to one declaring them; a
# WORKFLOW does not, because the states are the project's and that is the
# entire point. A default nobody can see is the tool's opinion wearing the
# project's clothes.
#
# The tool keeps three opinions and no more: the category set is
# `todo`/`in_progress`/`done`, they are ordered that way, and every declared
# state maps to exactly one. Everything below — how many states, what they are
# called, which category each sits in, what order they appear in within it — is
# ours, and changing a word here changes no code anywhere.
#
# Each kind holds what the belts WRITE for it: a story is claimed (`building`)
# and closed (`done`), a feature is additionally `reviewing` while its record
# is written, and the milestone walks all seven — `accepted` and `packaging`
# are milestone acts and `in_progress`: a category is about whether WORK
# REMAINS, not about whether the outcome is decided. Thirty stories sat at
# `reviewing` here under the all-seven seed, a state no belt writes.
#
# `obe` is in `done` for every kind that can hold it. It is FINISHED and not
# DELIVERED, and those are different axes — Jira keeps `Won't Do` in the Done
# category and puts delivered-vs-not in a separate `resolution` field, which is
# the side `docs/design/state-categories.md` §4 takes and why there is no
# fourth category here.

# WHAT ARRIVING AT A STATE ASKS (0.5.0/D3). There is one event here and it is
# ARRIVAL: a grain reaches a state. This is NOT a transition table and never
# becomes one — the unit is the state arrived at, never the pair (from, to), so
# `building -> planning` is an arrival at `planning`, a second pass through a
# state asks the same question, and backwards was never a special case.
#
# Self-hosted for the reason every rule here is: this tree built thirteen
# grains and closed none, having written the rule down twice. The move is the
# surface the operator is already standing in, so the question is asked there —
# with both answers already typed, because the friction was never the review,
# it was deciding what to type while something else was running.
[pm.arrive.feature.building]
ask     = "what is building this?"
answers = ["--by me", "--by agent <type>"]
have    = { "tools/dev/agent-worktree.sh" = "isolation for parallel work on this grain", "tools/hooks/cc-ledger-subagent.sh" = "records this dispatch's spend when GDK_LEDGER_GRAIN=<id> is exported before the spawn; `pm ledger record --grain <id>` files it by hand on return" }

[pm.arrive.feature.reviewing]
ask     = "what happens to it?"
answers = ["--review agent <type>", "--skip review \"<why>\""]

[pm.arrive.feature.obe]
ask     = "why is this abandoned?"
answers = ["--why \"<reason>\""]

[pm.arrive.story.building]
ask     = "what is building this?"
answers = ["--by me", "--by agent <type>"]
have    = { "tools/dev/agent-worktree.sh" = "isolation for parallel work on this grain", "tools/hooks/cc-ledger-subagent.sh" = "records this dispatch's spend when GDK_LEDGER_GRAIN=<id> is exported before the spawn; `pm ledger record --grain <id>` files it by hand on return" }

[pm.arrive.story.obe]
ask     = "why is this abandoned?"
answers = ["--why \"<reason>\""]

[pm.states.milestone]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing", "accepted", "packaging"]
done        = ["done", "obe"]

[pm.states.feature]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing"]
done        = ["done", "obe"]

[pm.states.story]
todo        = ["planning", "ready"]
in_progress = ["building"]
done        = ["done", "obe"]

[pm.states.bug]
todo        = ["open"]
in_progress = ["fixed"]
done        = ["closed"]

[verify]
# The verification LADDER, self-hosted. Decision D3 (0.2.0): `[verify]` says
# which RUNG a composition is; the Makefile stays the authority on what the
# target RUNS. So these are make target NAMES, never a second command string —
# a project that renames a target changes one line here, and there is never a
# second answer to "did the full gate pass". `agentic-sdlc verify --check`
# holds each target to existing in this Makefile.
#
# Three rungs, one shape. The story rung was `[[verify.narrow]]` tables that
# diffed a commit range and matched paths against globs; that engine is gone
# (2026-09-06, Chris: "stories should just run simple fast unit tests"), and
# the key is refused by name.
#
# THE FEATURE RUNG IS LOCAL INTEGRATION, and it stopped being that for about an
# hour on 2026-09-05, which is worth recording rather than quietly fixing. It
# read `make precommit`, and `precommit` was the whole suite — so the rung was
# honest. Then `precommit` became gates + hooks + unit and this line did not
# move, so a feature closed having run no integration test at all. A ladder is
# only true while every rung names what it still runs.
#
# Chris's model, and the rungs match it: "Build, unit, done. Build, unit,
# done. Stack up to features. Feature review, local integration, done."
#
#   an edit, inner loop     verify --story      seconds  `unit`: no subprocess
#   closing a story         close story         seconds  (runs the story rung)
#   closing a feature       verify --feature    ~40 s    BOTH tiers, locally
#   closing a milestone     verify --milestone           the matrix, once
story     = "make unit"
feature   = "make test"
milestone = "make milestone"

# --- the release conveyor -----------------------------------------------------
# The step list is the SHIPPED default, so it is not restated here — a list
# copied into config is a list that stops tracking the registry. What IS here is
# the two facts that are this repo's and nobody else's.

[release.version_files]
# Hard rule 7: `__version__` and `version` move together, ALWAYS. This package
# carries the number in two files, so `version-sync` is asked about both — the
# default is `[pm] version_file` alone, which would have checked one of them and
# reported the pair in sync while they were not. That is the rule this repo
# wrote for itself being enforced on itself for the first time.
"pyproject.toml" = '^version = "(.*)"$'
"src/agentic_sdlc/__init__.py" = "^__version__ = '(.*)'$"

[release.commands]
# `prove-artifact` ships with NO default, because the proof names a git URL and
# a URL is a project's fact, not this package's (rule 8). Ours:
prove-artifact = "uvx --from git+https://github.com/cdowin/agentic-sdlc@v{version} agentic-sdlc --version"

[emit]
# This package's thesis for 0.5.0 is "a move is an event" — and it shipped the
# seam declaring no sink, so its own ledger held zero `rung.enter` rows while
# the milestone that built them was in flight. Self-hosting, found by the
# entry-edge review (m5). `ledger` routes each row to the milestone that owns
# its grain, exactly as every other row kind does; no path, no stdout, nothing
# for a consumer to parse differently.
sink = "ledger"

# --- [dispatch] --------------------------------------------------------------
# What `agentic-sdlc dispatch` renders at the top of an agent brief. A WORKFLOW
# key: nothing stands behind it, and the reader refuses BY NAME when it is
# absent. The CONTRACTS are POINTED AT, never copied — a 163-line paste in every
# brief is the volume this milestone rejected.
[dispatch]
project = "agentic-sdlc — a reader/writer over a PM tree, shipped as a pinned-tag Python package. Stdlib only, pure text, exit codes are contract. Public repo, MIT."
contracts = ["CLAUDE.md", "SDLC.md", ".claude/rules/pm-execution.md"]
