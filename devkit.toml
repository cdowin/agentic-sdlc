# agentic-sdlc's config for agentic-sdlc. The toolkit runs its own gates on its
# own tree: a gate nobody points at its author is a gate nobody has tested at
# the one place its defects are cheapest to find.
#
# Everything here is a SCOPE or an APPLICABILITY statement. Nothing weakens a
# rule, and nothing is a fork — rule 5 is that per-project variation lives in
# this file, and this file is the proof it can.

[checks]
# The roster `check all` runs HERE. The stock default is `doc` + `shell` — the
# two that apply to any repo — and this file adds the two the stock roster
# leaves off for reasons that do not hold here. (`shell` was an addition in
# THIS file until 0.2.0, made when the repo started self-hosting its own hook
# corpus under tools/ in 0.23.0; the .tscn/.tres-reading gates that used to
# redden this roster over a 0-file census left with the scene half.)
#
# `pm` is stock-OFF because it would fail a consumer for having no PM tree at
# all. This tree IS one, self-hosted, so the gate is pointed at its author.
#
# `repo-hygiene` is the one known gate this file still leaves out: it hits the
# network and belongs at milestone close, not inside every `make check`.
#
# `hooks` is the other half of that self-hosting, and it is here because the
# sentence was not enough: `core.hooksPath` was unset in every checkout of this
# repo for two releases while CLAUDE.md said the corpus was armed, and no target
# looked. It is stock-OFF for consumers — arming is a decision each makes once —
# and on for the repo that told them to.
#
# `grain-shape` is stock-ON (0.2.0) and is named here for the same reason
# `shell` is: an explicit roster does not inherit the stock default, so a gate
# this file forgets is a gate this repo — the one that ships it — never runs on
# itself. Self-hosting is the proof that the caps it ships are caps real grains
# written by several hands can meet.
all = ["doc", "grain-shape", "pm", "shell", "hooks"]

# No scope section is set for the gates above. The deliberately-drifted trees
# under tests/fixtures/ are the INPUT to this package's tests, not content this
# repo maintains — but every gate still on the roster is pointed at markdown,
# shell, git or the PM tree, and none of them walks that directory, so there is
# nothing left here to carve out. The three `exclude_prefixes` sections that did
# the carving left with the gates that read them (0.2.0).

[pm]
# Everything opt-in except D8. The rules this package ships OFF by default are
# off because a consumer's legacy tree would go red on upgrade day — this tree
# has no legacy, so it takes all of them and stays inside them from entry one.
#
# D8 (project version == the building milestone's id) is the one rule that does
# not apply, and it says so itself: it encodes bump-at-START, and this package
# bumps at CLOSE, in the release commit, per the release skill. Enabling it here
# would mean publishing 0.14.0 in pyproject.toml before 0.14.0 exists. A rule
# that fits a different valid flow is not a rule to switch on and pad around.
#
# D9 and D10 DO apply: work happens on `milestone/<id>` (SDLC.md §1), main is
# merge-commit-only at close, and D3 (0.16.0) is the decision that caught this
# tree working on main while telling its consumers not to — D10 is what stops
# that recurring silently.
checks = [
    "D1", "D2", "D3", "D4", "D5", "D6",
    "D9", "D10",
    "V1", "V2", "V3", "V4", "V5", "V6",
]

[tests]
# THE CEILINGS, and they are ours rather than the package's. `check budget`
# ships with none — "twenty seconds" is a claim about a machine, and rule 8
# says this package knows nothing about the machines its consumers run on — so
# a tree that declares nothing gets its costs reported and exit 0.
#
# Measured 2026-09-05 on the floor interpreter, after the tier split:
# unit 7.2 s in one process, integration ~64 s on eight workers, both ~62 s.
# The ceilings are roughly 2x each, because a shared CI runner is not a laptop
# and a gate that goes red on a busy afternoon is a gate somebody deletes.
#
# NOT IN `[checks] all`, and that is a ruling rather than an oversight.
# `check all` is the PER-CHANGE gate: it runs in `precommit`, in a pre-push
# hook, and inside `test_makefile_gates`, which spawns `make gates` against
# this very tree. A budget gate there grades the LAST suite run, so one slow
# afternoon reddens the next person's edit for a reason they cannot act on —
# and it made nine tests fail for a timing number that had nothing to do with
# what they assert. A gate that reddens on somebody else's clock is milestone
# risk 2 with a stopwatch, and it is the kind that gets deleted.
#
# It runs in `make milestone`, once, where a regression is a thing to act on.
#
# They exist to catch a DOUBLING, not a wobble. The drift this is aimed at is
# the one that already happened here: 240 s of suite, arrived at one honest
# fixture at a time, with every gate green the whole way down.
budget = { unit = 20, integration = 130, test = 150 }

# AND A CEILING ON SIZE, which the duration cannot see. A tier holds its wall
# clock while doubling in case count — parallelism and a faster machine both
# absorb it — and the number that then goes wrong is the reader's, not the
# gate's. Measured 2026-09-05: 1,123 unit and 730 integration.
#
# Set ~10% above today, because the point is to make GROWTH a decision somebody
# argues rather than one that happens. `0.2.0/the-proof-is-named-in-the-criterion`
# is the pass that brings both numbers down; until it lands these hold the line.
cases = { unit = 1250, integration = 800 }
# V6 is named on purpose, and it is the one rule here that is NOT stock. This
# tree keeps generated execution lists and is small enough for `pm sync` to be
# cheap, so the gate holds the view to the tree. A project whose lists go stale
# on ordinary work should leave it off and reach for `pm sync --check`.
# Nothing else is set. The prose ratchets, their six line caps and their three
# grandfather ledgers were deleted in 0.15.0, and every key they read is now
# named at exit 2 by `check pm` — so this file declares scope and roster, and
# says nothing about the length of anybody's markdown.

# --- THE FLOW, and it is this project's rather than the engine's --------------
# Written by `agentic-sdlc pm init`, read every run, never assumed. This is the
# section hard rule 5 splits on: a GATE ships stock defaults and a repo with no
# devkit.toml runs every gate byte-identically to one declaring them; a
# WORKFLOW does not, because the states are the project's and that is the
# entire point. A default nobody can see is the engine's opinion wearing the
# project's clothes.
#
# The engine keeps three opinions and no more: the category set is
# `todo`/`in_progress`/`done`, they are ordered that way, and every declared
# state maps to exactly one. Everything below — how many states, what they are
# called, which category each sits in, what order they appear in within it — is
# ours, and changing a word here changes no code anywhere.
#
# The values reproduce 0.2.0's LIFECYCLE exactly, because this tree accepted
# what `init` wrote. `accepted` and `packaging` are `in_progress`: a category
# is about whether WORK REMAINS, not about whether the outcome is decided.
#
# `obe` is in `done` for every kind that can hold it. It is FINISHED and not
# DELIVERED, and those are different axes — Jira keeps `Won't Do` in the Done
# category and puts delivered-vs-not in a separate `resolution` field, which is
# the side `docs/design/state-categories.md` §4 takes and why there is no
# fourth category here.

[pm.states.milestone]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing", "accepted", "packaging"]
done        = ["done", "obe"]

[pm.states.feature]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing", "accepted", "packaging"]
done        = ["done", "obe"]

[pm.states.story]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing", "accepted", "packaging"]
done        = ["done", "obe"]

[pm.states.bug]
todo        = ["open"]
in_progress = ["fixed"]
done        = ["closed"]

[verify]
# The verification LADDER, self-hosted. Decision D3 (0.2.0): `[verify]` says
# which RUNG a composition is; the Makefile stays the authority on what the
# target RUNS. So these two are make target NAMES, never a second command
# string — a project that renames a target changes one line here, and there is
# never a second answer to "did the full gate pass".
#
# The story rung is `[[verify.narrow]]` below rather than a third key, because
# it is a FUNCTION of the changed paths and make cannot compute one.
#
# Self-hosting is the proof, not a demo: a rule set that only works on a
# fixture is a rule set nobody has run. `agentic-sdlc verify --check` holds
# every glob below to matching at least one TRACKED file and every `make`
# target it names to existing in this Makefile.
#
# THE INTERPRETER IS SPELLED OUT, and it has to be. These read
# `uv run --python 3.11 --with pytest python -m pytest`, which is what the
# Makefile's own PYTEST expands to — not bare `python3`, which on this machine
# is Homebrew 3.14 and has no pytest at all. Written the short way first, and
# `verify --check` passed it: that verb holds a glob to matching a tracked file
# and a `make` target to existing, and it has no opinion about whether a shell
# command will work. It was `close story` on a real story that found it, which
# is the belt below catching what the declaration above it could not.
# THE FEATURE RUNG IS LOCAL INTEGRATION, and it stopped being that for about an
# hour on 2026-09-05, which is worth recording rather than quietly fixing.
#
# It read `make precommit`, and `precommit` was the whole suite — so the rung
# was honest. Then `precommit` became the NARROW rung (gates + hooks + unit,
# 10 s) and this line did not move, so a feature closed having run no
# integration test at all. A ladder is only true while every rung names what it
# still runs.
#
# Chris's model, and the rungs now match it: "Build, unit, done. Build, unit,
# done. Stack up to features. Feature review, local integration, done."
#
#   a PM-tree or doc edit   make gates      ~2 s    (a [[verify.narrow]] rule)
#   an edit, inner loop     verify --story  seconds (the paths decide)
#   closing a story         close story     seconds
#   closing a feature       verify --feature ~36 s  <- BOTH tiers, locally
#   closing a milestone     verify --milestone      the matrix, once
feature   = "make test"
milestone = "make milestone"

# ORDER IS THE RUN ORDER, and the first matching rule wins per path — so the
# most specific claim comes first. A rule added below an existing one that
# already matches is a rule that never fires.

# Editing a test module proves itself. The narrowest rung there is.
[[verify.narrow]]
paths = "tests/test_<name>.py"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_<name>.py -q"

# conftest DERIVES the `shell` mark, and test_shell_mark.py is the census that
# holds the derivation to what the modules actually do.
[[verify.narrow]]
paths = "tests/conftest.py"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_shell_mark.py -q"

# A shared helper or a vendored fixture is reachable from anywhere in the
# suite, so there is no narrowing to be had and saying so is the honest answer.
[[verify.narrow]]
paths = "tests/support/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/ -q"

[[verify.narrow]]
paths = "tests/fixtures/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/ -q"

[[verify.narrow]]
paths = "src/agentic_sdlc/repo/pm/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_pm_*.py tests/test_verdict.py tests/test_boundaries.py -q"

[[verify.narrow]]
paths = "src/agentic_sdlc/repo/verify/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_verify_*.py tests/test_boundaries.py -q"

# The conveyor. `test_install*.py` is in the slice because `install-sdlc`
# RENDERS from the step registry — a step added without a doc line is a
# protocol shorter than the list that runs, which is the drift this whole
# feature exists to end.
[[verify.narrow]]
paths = "src/agentic_sdlc/repo/conveyor/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_conveyor_*.py tests/test_install_sdlc.py tests/test_boundaries.py -q"

[[verify.narrow]]
paths = "src/agentic_sdlc/repo/checks/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_check_*.py tests/test_pm_gate.py tests/test_gate_roster.py tests/test_boundaries.py -q"

# The installables are proven by INSTALLING them into a temp repo and running
# them, which is six modules and no fewer — the corpus is the contract.
[[verify.narrow]]
paths = "src/agentic_sdlc/repo/installables/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_install.py tests/test_fresh_project.py tests/test_ci_workflows.py tests/test_makefile_include.py tests/test_gate_library.py tests/test_hooks_payloads.py -q"

[[verify.narrow]]
paths = "src/agentic_sdlc/repo/<name>.py"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_gates_extra.py tests/test_install.py tests/test_init_verb.py tests/test_boundaries.py -q"

[[verify.narrow]]
paths = "src/agentic_sdlc/core/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_apply.py tests/test_fuzz_markdown.py tests/test_boundaries.py -q"

[[verify.narrow]]
paths = "src/agentic_sdlc/<name>.py"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_cli_surface.py tests/test_gate_roster.py tests/test_boundaries.py -q"

# `tools/` IS the installer's output here (0.23.0 self-hosting), so the hook
# corpora are what proves an edit to it — and that is a make target, which is
# also how this rung gets a measured cost in the ledger.
[[verify.narrow]]
paths = "tools/**"
run   = "make hooks-self-test"

[[verify.narrow]]
paths = "Makefile"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_makefile_gates.py tests/test_makefile_include.py -q"

# devkit.toml, the PM tree and the root prose are all read by the static gates
# and by nothing else, so `make gates` is exactly the slice.
[[verify.narrow]]
paths = "devkit.toml"
run   = "make gates"

[[verify.narrow]]
paths = "pm/roadmap/**"
run   = "make gates"

[[verify.narrow]]
paths = "<doc>.md"
run   = "make gates"

# The agent roster and the two skills are INSTALLED files here (CLAUDE.md
# § Self-hosting), so what proves an edit to one is the installer suite that
# asserts this repo's copies stay byte-current with the source.
[[verify.narrow]]
paths = ".claude/**"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_install.py -q"

[[verify.narrow]]
paths = "docs/**"
run   = "make gates"

[[verify.narrow]]
paths = ".gitignore"
run   = "uv run --python 3.11 --with pytest python -m pytest tests/test_init_verb.py -q"

# --- the release conveyor -----------------------------------------------------
# The step list is the SHIPPED default, so it is not restated here — a list
# copied into config is a list that stops tracking the registry. What IS here is
# the two facts that are this repo's and nobody else's.

[release.version_files]
# Hard rule 7: `__version__` and `version` move together, ALWAYS. This package
# carries the number in two files, so `version-sync` is asked about both — the
# default is `[pm] version_file` alone, which would have checked one of them and
# reported the pair in sync while they were not. That is the rule this repo
# wrote for itself being enforced on itself for the first time.
"pyproject.toml" = '^version = "(.*)"$'
"src/agentic_sdlc/__init__.py" = "^__version__ = '(.*)'$"

[release.commands]
# `prove-artifact` ships with NO default, because the proof names a git URL and
# a URL is a project's fact, not this package's (rule 8). Ours:
prove-artifact = "uvx --from git+https://github.com/cdowin/agentic-sdlc@v{version} agentic-sdlc --version"

# More words that mean FINISHED, beyond the last state in each grain's list.
# Empty by default and empty here — this tree abandons nothing yet — but the
# key is declared in the shipped project-devkit.toml template so a consumer
# meets it before it bites them.
#
# It is the `done` CATEGORY with its members enumerated by hand.
# docs/design/state-categories.md is the model: three categories (todo,
# in_progress, done), hard, with the states inside them and their mapping
# configurable. 0.3.0 builds it and reads this key into it.
