[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sdlc"
version = "2.3.0"
description = "A deterministic SDLC as a pinned-tag CLI: a markdown-and-frontmatter PM tracker with its own drift gate, static repo gates (doc, shell, repo-hygiene, hooks), the agent-workflow guard corpus, and installers for the CI, agent and hook files a project runs the loop with. Stdlib only."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Chris Dowin" }]
keywords = ["sdlc", "project-management", "gates", "agents", "tooling", "lint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/cdowin/agentic-sdlc"

[project.scripts]
agentic-sdlc = "agentic_sdlc.cli:main"

# TEST-time only. Hard rule 1 governs the RUNTIME — the package ships no
# dependency — and `uv run` installs this tree on itself with these beside it,
# which is what the Makefile's gates run.
[dependency-groups]
dev = ["pytest", "pytest-xdist", "ruff==0.16.10"]

# `make lint` runs ruff over src tests tools; `make check` runs it through
# `[gates] extra`. The pin above is exact, so a ruff release never changes the
# verdict on an unchanged tree. The rule set starts small and passes today:
# syntax errors (E9) and pyflakes (F).
[tool.ruff.lint]
select = ["E9", "F"]

# The F findings this tree held when the gate went in, waived per FILE and per
# CODE so every code stays live for every other file and for new code. A fix
# deletes its line here. Tracked as a bug, not as a rule change.
[tool.ruff.lint.per-file-ignores]
"src/agentic_sdlc/repo/checks/pm.py" = ["F541"]
"src/agentic_sdlc/repo/checks/repo_hygiene.py" = ["F541"]
"src/agentic_sdlc/repo/dispatch.py" = ["F401"]
"src/agentic_sdlc/repo/init.py" = ["F541"]
"src/agentic_sdlc/repo/install.py" = ["F841"]
"src/agentic_sdlc/repo/pm/cli.py" = ["F541"]
"src/agentic_sdlc/repo/pm/vocabulary.py" = ["F541"]
"src/agentic_sdlc/repo/verify/main.py" = ["F401"]
"tests/support/__init__.py" = ["F401"]
"tests/test_ci_compare_step.py" = ["F401", "F811"]
"tests/test_ci_workflows.py" = ["F401"]
"tests/test_consumer_independence.py" = ["F541"]
"tests/test_contracts.py" = ["F401"]
"tests/test_grain_shape.py" = ["F401", "F841"]
"tests/test_pm_guidance.py" = ["F401", "F841"]
"tests/test_pm_ledger.py" = ["F811"]
"tests/test_pm_ledger_record.py" = ["F811"]
"tests/test_pm_scaffold.py" = ["F841"]
"tests/test_replay_migration.py" = ["F841"]
"tests/test_verify_main.py" = ["F401"]
"tests/test_verify_spawns.py" = ["F401"]

# A repo with no pytest config is a repo where every agent invents its own
# incantation. `pytest` from the root now means exactly one thing.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fuzz: a seeded differential or replay harness. Deterministic by contract — a fuzz that varies run to run is not a gate. `make fuzz` runs the slice; `make test` runs it too, because a harness that only runs when somebody remembers it does not run.",
    "shell: the module spawns a process — bash, make, git, an installed hook corpus. DERIVED at collection by `tests/conftest.py` from what the source imports, never hand-applied; a hand-written one is a collection refusal naming the file. `make test` runs it and so does the floor interpreter in `make matrix`; the other interpreters skip it, because a `subprocess` is not something a Python version changes.",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sdlc"]
# The guidance markdown is read at runtime via importlib.resources — it must be
# in the wheel, not just the sdist.
artifacts = ["src/agentic_sdlc/repo/pm/guidance/*.md",
             "src/agentic_sdlc/repo/pm/templates/*.md",
             "src/agentic_sdlc/repo/installables/*"]
