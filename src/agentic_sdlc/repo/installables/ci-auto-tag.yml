# GENERATED by agentic-sdlc — `agentic-sdlc install-ci`.
#
# On a push to the mainline, read the project's version out of VERSION_FILE
# (the project-config block below) and tag it (`v0.62.0`). Idempotent: an
# existing tag is a skip, not a failure, so a docs-only follow-up push cannot
# redden the run.
#
# THE DISPATCH IS EXPLICIT AND CONDITIONAL. A tag pushed with the default
# GITHUB_TOKEN does NOT trigger downstream workflows (GitHub's recursion
# guard), so the release build has to be dispatched by name. That name is
# RELEASE_WORKFLOW below — the one project-specific string in this file, and a
# variable rather than a hard-coded assumption. A project that has no release
# pipeline yet leaves it and gets a green "tagged only" step: the workflow is
# looked for on disk, and its absence is a documented outcome rather than a red
# X somebody has to learn to ignore. The dispatched workflow is called with
# `-f tag=<tag>`, so it wants a `tag` input.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: Auto-Tag Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# --- project config ----------------------------------------------------------
# Where this project's version lives, and how to pull it out. Two knobs, at the
# head, because a generic workflow cannot know either — and a wrong guess here
# mints a tag named `v`. It refuses instead, naming both.
#
# VERSION_PATTERN is a POSIX extended regex with ONE capture group, applied as
# `sed -n -E "s#<pattern>#\1#p"`. `#` is the substitution delimiter, so the
# pattern may not contain one. Worked shapes:
#
#   pyproject.toml   ^version[[:space:]]*=[[:space:]]*"([^"]+)".*$
#   package.json     ^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*$
#   Cargo.toml       ^version[[:space:]]*=[[:space:]]*"([^"]+)".*$
#   VERSION          ^([0-9][^[:space:]]*)$
#
# An engine or framework that keeps the version in its own project file is the
# same job: name that file, and write the pattern that pulls the value out.
#
# THE SAME FILE IS `[pm] version_file` in devkit.toml — the pm tracker reads it
# for the bump rule, and the two are meant to name one file. They are written
# down twice on purpose: bash has no TOML reader, and a half-parsed devkit.toml
# is worse than a second copy you can see. Change one, change the other. Keep
# it in step with semver-gate.yml too — that gate admits the version this file
# tags.
env:
  VERSION_FILE: pyproject.toml
  VERSION_PATTERN: '^version[[:space:]]*=[[:space:]]*"([^"]+)".*$'

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          # A version that cannot be read REFUSES here, naming the file and the
          # pattern. The alternative is a tag literally named `v`, pushed to the
          # mainline, dispatching a release build at it — and the empty string
          # that produced it never appears in the log.
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::Could not read a version: VERSION_FILE='$VERSION_FILE' does not exist. Set VERSION_FILE at the head of this workflow (the same file as [pm] version_file in devkit.toml)."
            exit 1
          fi
          VERSION=$(sed -n -E "s#${VERSION_PATTERN}#\1#p" "$VERSION_FILE" | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read a version from '$VERSION_FILE': VERSION_PATTERN='$VERSION_PATTERN' matched no line. Fix VERSION_FILE / VERSION_PATTERN at the head of this workflow — an empty version tags this commit 'v'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION (from $VERSION_FILE)"

      - name: Check if the tag exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist — will create"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Dispatch the release build
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          # Your release pipeline. Absent = this step is a no-op, by design.
          RELEASE_WORKFLOW: release.yml
        run: |
          if [ ! -f ".github/workflows/$RELEASE_WORKFLOW" ]; then
            echo "No .github/workflows/$RELEASE_WORKFLOW — tagged only, nothing dispatched."
            exit 0
          fi
          TAG="v$VERSION"
          gh workflow run "$RELEASE_WORKFLOW" --ref "$TAG" -f tag="$TAG"
          echo "Dispatched $RELEASE_WORKFLOW at $TAG"
