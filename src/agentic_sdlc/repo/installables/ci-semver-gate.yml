# GENERATED by agentic-sdlc — `agentic-sdlc install-ci`.
#
# Every merge to the mainline bumps the version, on purpose. This reads the
# project's version out of VERSION_FILE (the project-config block below) on the
# PR branch and on main, blocks the merge unless the PR's is strictly greater,
# and then asks what the version IS: the id of a `done` milestone under
# PM_ROADMAP (a step env, default `pm/roadmap` — match `[pm] roadmap_dir`), or
# main's version plus one hotfix component. A milestone at any other status
# whose id is the PR's version refuses: the next milestone's bump-at-start
# waits until the close has merged.
#
# VERSIONS OF ANY LENGTH compare component-wise: a missing component defaults
# to 0, so `0.16` -> `0.16.1` is the bump it is, and a fourth component (a
# hotfix `0.90.3` -> `0.90.3.1`, a sub-milestone `0.90.4.1`) is compared, not
# dropped. A non-numeric component is refused rather than crashing the test.
#
# The FIRST versioned merge is allowed with a warning: main having no readable
# version yet is a one-time state, and failing it would mean no first merge
# could ever land. The PR side has no such excuse and refuses (see below).
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: Semver Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# --- project config ----------------------------------------------------------
# Where this project's version lives, and how to pull it out. Two knobs, at the
# head, because a generic workflow cannot know either — and a wrong guess here
# is not a small problem: this gate blocks a merge, so a version it could not
# read would be a gate passing over nothing. It refuses instead, naming both.
#
# VERSION_PATTERN is a POSIX extended regex with ONE capture group, applied as
# `sed -n -E "s#<pattern>#\1#p"`. `#` is the substitution delimiter, so the
# pattern may not contain one. Worked shapes:
#
#   pyproject.toml   ^version[[:space:]]*=[[:space:]]*"([^"]+)".*$
#   package.json     ^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*$
#   Cargo.toml       ^version[[:space:]]*=[[:space:]]*"([^"]+)".*$
#   VERSION          ^([0-9][^[:space:]]*)$
#
# An engine or framework that keeps the version in its own project file is the
# same job: name that file, and write the pattern that pulls the value out.
#
# THE SAME FILE IS `[pm] version_file` in devkit.toml — the pm tracker reads it
# for the bump rule, and the two are meant to name one file. They are written
# down twice on purpose: bash has no TOML reader, and a half-parsed devkit.toml
# is worse than a second copy you can see. Change one, change the other.
env:
  VERSION_FILE: pyproject.toml
  VERSION_PATTERN: '^version[[:space:]]*=[[:space:]]*"([^"]+)".*$'

jobs:
  check-version:
    name: Version must increase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract versions
        id: versions
        run: |
          # One reader, used twice — the PR branch's file and main's copy.
          read_version() { sed -n -E "s#${VERSION_PATTERN}#\1#p" | head -1; }

          # The PR side REFUSES rather than yielding an empty string: this gate
          # blocks a merge, and a gate that compared "" to "" would wave every
          # PR through while looking green. Both knobs are named in the refusal
          # because either one is the thing that is wrong.
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::Could not read a version on the PR branch: VERSION_FILE='$VERSION_FILE' does not exist. Set VERSION_FILE at the head of this workflow (the same file as [pm] version_file in devkit.toml)."
            exit 1
          fi
          PR_VERSION=$(read_version < "$VERSION_FILE")
          if [ -z "$PR_VERSION" ]; then
            echo "::error::Could not read a version from '$VERSION_FILE' on the PR branch: VERSION_PATTERN='$VERSION_PATTERN' matched no line. Fix VERSION_FILE / VERSION_PATTERN at the head of this workflow."
            exit 1
          fi

          git fetch origin main
          # Main's copy may legitimately not be there yet — the first versioned
          # merge — so this side does not refuse here. The compare step below
          # says so as a warning and allows it, once.
          MAIN_VERSION=$(git show "origin/main:$VERSION_FILE" 2>/dev/null | read_version)
          echo "pr_version=$PR_VERSION" >> "$GITHUB_OUTPUT"
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "PR version: $PR_VERSION (from $VERSION_FILE)"
          echo "Main version: ${MAIN_VERSION:-<none on main yet>}"

      - name: Compare versions
        env:
          PR: ${{ steps.versions.outputs.pr_version }}
          MAIN: ${{ steps.versions.outputs.main_version }}
          PM_ROADMAP: pm/roadmap
        run: |
          if [ -z "$PR" ]; then
            echo "::error::Could not read a version from '${VERSION_FILE:-the version file}' on the PR branch: VERSION_PATTERN='${VERSION_PATTERN:-unset}' matched no line."
            exit 1
          fi

          if [ -z "$MAIN" ]; then
            echo "::warning::No version in '${VERSION_FILE:-the version file}' on main yet — first versioned merge. Allowing."
            exit 0
          fi

          # Compare component-wise, ANY length; a missing component is 0, so a
          # two-part version compares numerically, and a fourth part (a hotfix
          # 0.90.3 -> 0.90.3.1, a sub-milestone id 0.90.4.1) is compared rather
          # than dropped on the floor. A non-numeric component refuses: a
          # letter suffix would otherwise error this gate on every later PR.
          IFS='.' read -r -a PR_PARTS <<< "$PR"
          IFS='.' read -r -a MAIN_PARTS <<< "$MAIN"
          n=${#PR_PARTS[@]}; [ "${#MAIN_PARTS[@]}" -gt "$n" ] && n=${#MAIN_PARTS[@]}
          verdict=equal
          for ((i = 0; i < n; i++)); do
            p="${PR_PARTS[i]:-0}"; m="${MAIN_PARTS[i]:-0}"
            case "$p$m" in *[!0-9]*)
              echo "::error::Non-numeric version component — main is '$MAIN', PR is '$PR'. Versions are dotted integers only."
              exit 1;;
            esac
            if [ "$p" -gt "$m" ]; then verdict=greater; break
            elif [ "$p" -lt "$m" ]; then verdict=less; break; fi
          done
          if [ "$verdict" != greater ]; then
            echo "::error::Version must increase. Main is $MAIN, PR is $PR. Bump the version in ${VERSION_FILE:-the version file} before merging."
            exit 1
          fi

          # A merge to the mainline carries exactly one of two things: the id
          # of a DONE milestone in the PM tree, or main's version plus one
          # hotfix component (0.90.3 -> 0.90.3.1). Nothing else — in
          # particular not a BUILDING milestone's id: bump-at-start of the
          # next milestone waits until the previous close has merged, or the
          # release lands wearing the next milestone's number and the tag
          # names the wrong thing. PM_ROADMAP is [pm] roadmap_dir.
          legit=""
          case "$PR" in "$MAIN".*)
            rest="${PR#"$MAIN".}"
            case "$rest" in ""|0*|*[!0-9]*) ;; *) legit="hotfix $rest on main's $MAIN";; esac;;
          esac
          # Every milestone in the tree, whatever its status: a DONE one whose
          # id is $PR is the release; ANY OTHER status whose id is $PR refuses,
          # hotfix reading or not — that is the building-milestone case. id
          # and status are read from the frontmatter fence only, anchored,
          # with either quote style, so a schema example in the body cannot
          # vouch for the file.
          # The front block is the lines between the opening fence and the
          # CLOSING one; a file that never closes its fence yields nothing.
          fm() { tr -d '\r' < "$1" | awk 'NR==1{if($0!="---")exit;next} $0=="---"{printf "%s",buf;exit} {buf=buf $0 "\n"}' | sed -n "s/^$2:[[:space:]]*[\"']\{0,1\}\([^\"']*\)[\"']\{0,1\}[[:space:]]*$/\1/p" | sed 's/[[:space:]]*$//' | head -1; }
          if [ ! -d "$PM_ROADMAP" ]; then
            echo "::error::PM_ROADMAP='$PM_ROADMAP' is not a directory — set the step env to this project's [pm] roadmap_dir. A gate that scanned nothing cannot say OK."
            exit 1
          fi
          scanned=0
          for m in "$PM_ROADMAP"/*/milestone.md; do
            [ -f "$m" ] || continue
            scanned=$((scanned + 1))
            id="$(fm "$m" id)"
            [ "$id" = "$PR" ] || continue
            status="$(fm "$m" status)"
            if [ "$status" = done ]; then
              legit="the id of done milestone $id"
            else
              echo "::error::$PR is the id of milestone $id, whose status is '${status:-unset}', not done. A release carries a CLOSED milestone; the bump-at-start of the NEXT milestone waits until the previous close has merged."
              exit 1
            fi
          done
          if [ "$scanned" -eq 0 ]; then
            echo "::error::no milestone.md under $PM_ROADMAP/*/ — the gate scanned nothing and cannot say OK. Set PM_ROADMAP to this project's [pm] roadmap_dir."
            exit 1
          fi
          if [ -z "$legit" ]; then
            echo "::error::$PR is neither the id of a done milestone under $PM_ROADMAP nor main's version ($MAIN) plus one hotfix component. A release is a closed milestone or a hotfix; the NEXT milestone's bump-at-start waits until this merge has landed."
            exit 1
          fi
          echo "Version bump OK: $MAIN -> $PR ($legit)"
