# GENERATED by agentic-sdlc — `agentic-sdlc install-ci`.
#
# One job, one opinion: check out, ARM the checkout, run this project's full
# gate. CI runs the same target the local full gate does — but the same target
# is not the same ANSWER unless the tree it runs on carries the same repo-local
# state. `core.hooksPath` is the measured case: it lives in .git/config, nothing
# tracked carries it, and a fresh checkout has never had it set, so a gate that
# asks whether this tree is armed was red on every CI run of a repo that runs
# one. The steps between the checkout and the gate are there to close exactly
# that gap.
#
# ASSUMES `make milestone` is your full gate. Nothing here discovers that — a
# project without the target gets a red run step naming it, which is where the
# assumption belongs. Add the target, or change the `run:` line.
#
# YOUR TOOLCHAIN IS YOURS TO ADD, and this file does not guess at it: an
# installable belongs to the kit whose ARTIFACT it acts on (decision D2 of
# 0.2.0), and this kit acts on git, markdown and shell. `setup-uv` stays
# because it is what resolves the pinned devkit package this file installs from
# and nothing else; a build toolchain your `make milestone` needs is a step you
# add BELOW, after the write, when this file is yours.
#
# The shape to copy is the arming step: guard it on a tracked file that only
# exists where the toolchain is wanted, so one file is right in both trees.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PM gates read `git worktree list` and branch placement, and the
          # doc gates read tracked files. A shallow checkout answers both
          # wrongly.
          fetch-depth: 0
      - name: Arm the tracked git hooks
        # Repo-local git config, and a checkout has none: `core.hooksPath` is
        # unset here however armed the developer's tree is, so `check hooks`
        # reports UNARMED and the full gate reds for a fact about the runner
        # rather than about the code. Guarded on the arming script itself — a
        # repo that does not ship one has no corpus to arm and skips this.
        if: hashFiles('tools/setup-hooks.sh') != ''
        run: bash tools/setup-hooks.sh
      - uses: astral-sh/setup-uv@v5
      # --- your toolchain goes here -----------------------------------------
      # Anything `make milestone` needs that the runner does not have. Guard it
      # the way the arming step above is guarded — on a tracked file that only
      # exists where the tool is wanted — so the same file stays right in a
      # repo that does not need it. For example:
      #
      #   - name: Install the linters this project's gate shells out to
      #     if: hashFiles('<a file only this kind of project has>') != ''
      #     run: |
      #       uv tool install "<linter>"
      #       sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # ----------------------------------------------------------------------
      - name: make milestone
        # The gates print one verdict line each and keep the transcript in
        # .gate-reports/; CI has no second look, so it streams.
        env:
          VERBOSE: "1"
        run: make milestone
      - name: keep the gate transcripts of a red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: .gate-reports/
          if-no-files-found: ignore
