# devkit.toml — this project's agentic-sdlc config.
#
# YOURS. `agentic-sdlc init` wrote this once and never overwrites it, not even
# with --force: the tool is pinned by DEVKIT_VERSION in the Makefile, and what
# that tool should do HERE is the project's own statement.
#
# Every section below is COMMENTED OUT and carries the stock default. A repo
# with no devkit.toml behaves byte-identically to one declaring every default,
# so deleting a section is always safe — uncomment only where your layout
# genuinely differs. `agentic-sdlc check <gate> --help` prints that gate's
# contract, its section and its honest scope.
#
# A key this package no longer honours is NAMED at exit 2, never ignored; a
# wrong-typed value (a bare string where a list belongs) is exit 2 as well,
# because a gate quietly scanning nothing is worse than a gate that stops.

# --- which gates run ----------------------------------------------------------
# The roster `agentic-sdlc check all` runs HERE. Five gates exist — `doc`,
# `shell`, `repo-hygiene`, `pm`, `hooks` — and two are in the stock aggregate.
# A repo holding NONE of a gate's file kind gets a 0-file census, and that gate
# correctly reddens — a gate that scanned nothing must say so. That is the
# roster being wrong for the repo, not a reason to soften a gate: narrow it
# here instead. An unknown name is exit 2.
#
# The other three are OPT-IN, each for its own reason: `repo-hygiene` is
# close-time and hits the network, `pm` would fail a repo that has no PM tree,
# and `hooks` would fail one that has not run `install-hooks` — arming is a
# decision a consumer makes once, and the gate is for a repo that has made it.
# Name any of them here to fold it in.
# [checks]
# all = ["doc", "shell"]

# `make check` runs the devkit gates and then YOUR gate targets, named here as
# make goals — extension by config, never a fork of Makefile.devkit. A name
# that is not a plain make goal (whitespace, a path, a shell or make
# metacharacter) is exit 2, and `check` refuses to re-enter itself.
# [gates]
# extra = []

# --- the repo gates -----------------------------------------------------------
# `check doc` reads your ALWAYS-LOADED agent docs and verifies their claims
# resolve: dead file paths, dead `make` targets (the root Makefile plus
# whatever it includes), dead markdown links, a skill written as a flat .md.
# [doc]
# scope = ["CLAUDE.md", ".claude/rules/*.md", ".claude/agents/*.md"]
# ephemeral = ["docs/reviews/"]

# `check shell` runs shellcheck -x over every script under these roots,
# extension-less hook entry points included. It soft-skips without shellcheck.
# [shell]
# roots = ["tools"]

# `check repo-hygiene` is CLOSE-TIME and fetches from the network.
# [repo_hygiene]
# mainline = "origin/main"
# protected = "^(main|staging|archive/.*)$"

# --- the PM tree --------------------------------------------------------------
# `agentic-sdlc pm` and its drift gate `check pm`. The states are closed sets
# and the transitions are open: any value in a grain's vocabulary is reachable,
# and the gate reports a tree that contradicts itself. `pm vocabulary` prints
# the rule ids in full.
# [pm]
# roadmap_dir  = "pm/roadmap"     # the tree, relative to the repo root
# template_dir = "pm/templates"   # REQUIRED to override a grain template
# review_dir   = "docs/reviews"   # where review records live
# review_slug_fallback = false    # also accept <review_dir>/<feature-slug>*.md
# story_ordinal_prefix = false    # also resolve stories/NN-<slug>.md
# checks = ["D1", "D2", "D3", "D4", "D5", "D6",   # drift rules — the default
#           "V1", "V2", "V3", "V4", "V5"]         # integrity rules
#                                   # V6 (execution lists match the tree) and
#                                   # the FLOW rules are opt-in: D8 (the project
#                                   # version equals the building milestone's
#                                   # id — bump-at-START), D9 (a building
#                                   # milestone declares `branch:`), D10 (that
#                                   # branch is neither empty nor the mainline).
# bug_states      = ["open", "fixed", "closed"]   # D4: the bug vocabulary
# version_file    = "pyproject.toml"              # D8: where the version lives
# version_pattern = '^version = "(.*)"$'          # D8: the line carrying it
#                                   # A project that keeps its version in an
#                                   # engine or framework file names that file
#                                   # and the line that carries it, e.g.
#                                   #   version_file    = "<its project file>"
#                                   #   version_pattern = '^<key>="(.*)"$'
#                                   # The CI workflows `install-ci` writes read
#                                   # the same fact from their own VERSION_FILE
#                                   # / VERSION_PATTERN env, at the head of
#                                   # each file — bash has no TOML reader, so
#                                   # it is written twice on purpose. Change
#                                   # one, change the other.
# milestone_states / feature_states / story_states are overridable the same way.
# All three default to ONE ordered vocabulary — planning, ready, building,
# reviewing, accepted, packaging, done — and a grain skips the states it does
# not need. A custom set's ORDER is its lifecycle order: D5 places "at work" by
# index within each grain's own set, at `building`, where the shaping half
# ends. So list the states in the order the work moves through them — an
# alphabetical list is a different lifecycle, not the same one tidied — and a
# set that drops `building` leaves D5 with nothing to compare, which
# `check pm` says out loud rather than passing in silence.
#
# The deprecation window that carried todo / wip / blocked / review through
# 0.24.0 is CLOSED: the stock sets are the seven words above and nothing else,
# so a grain still holding one of the four is a D4 finding. Rewrite them
# (todo -> ready, wip -> building, review -> reviewing, blocked -> building,
# recording what is blocking the work in the grain itself). Declaring your own
# set that happens to use one of those words is your vocabulary, not the
# window, and nothing here refuses it.

# --- your own gates -----------------------------------------------------------
# Everything heavier than the five gates above is this project's to supply, and
# it arrives through two seams rather than through a section here:
#
#   [gates] extra      — your own make goals, run by `make check` after the
#                        devkit roster. Static, same as the rest of `check`.
#   Makefile.tiers     — GDK_PRECOMMIT_TIERS / GDK_MILESTONE_TIERS, the target
#                        lists `precommit` and `milestone` compose from. This
#                        is where a build, an engine, a linter or a test tier
#                        belongs: it can boot, because it is not a devkit gate.
#
# A gate that reads one language's or one engine's file format is a gate that
# kit owns, and it configures itself in its own section of this file.

# --- more words that mean FINISHED --------------------------------------------
# Beyond the last state in each grain's list. Empty by default: a project that
# abandons nothing declares nothing.
#
# `ready-for feature` asks "is every story FINISHED", not "is every story at the
# word `done`" — so a story you stop working on needs a word here or it holds
# its feature open forever. This is the `done` CATEGORY with its members
# enumerated by hand; the model is three categories with the states inside them
# configurable, and it lands in 0.3.0.
#
# Declared in the [pm] block above, beside the state lists it extends:
#   also_done = ["obe", "wontfix", "duplicate"]
