# devkit.toml — this project's agentic-sdlc config.
#
# YOURS. `agentic-sdlc init` wrote this once and never overwrites it, not even
# with --force: the tool is pinned by DEVKIT_VERSION in the Makefile, and what
# that tool should do HERE is the project's own statement.
#
# Every section below is COMMENTED OUT and carries the stock default, with ONE
# exception — `[pm.states.*]`, which is LIVE and argued where it sits. A repo
# with no devkit.toml behaves byte-identically to one declaring every commented
# default, so deleting any of those is always safe — uncomment only where your
# layout genuinely differs. `agentic-sdlc check <gate> --help` prints that
# gate's contract, its section and its honest scope.
#
# A key this package no longer honours is NAMED at exit 2, never ignored; a
# wrong-typed value (a bare string where a list belongs) is exit 2 as well,
# because a gate quietly scanning nothing is worse than a gate that stops.

# --- which gates run ----------------------------------------------------------
# The roster `agentic-sdlc check all` runs HERE. Five gates exist — `doc`,
# `shell`, `repo-hygiene`, `pm`, `hooks` — and two are in the stock aggregate.
# A repo holding NONE of a gate's file kind gets a 0-file census, and that gate
# correctly reddens — a gate that scanned nothing must say so. That is the
# roster being wrong for the repo, not a reason to soften a gate: narrow it
# here instead. An unknown name is exit 2.
#
# The other three are OPT-IN, each for its own reason: `repo-hygiene` is
# close-time and hits the network, `pm` would fail a repo that has no PM tree,
# and `hooks` would fail one that has not run `install-hooks` — arming is a
# decision a consumer makes once, and the gate is for a repo that has made it.
# Name any of them here to fold it in.
# [checks]
# all = ["doc", "shell"]

# `make check` runs the devkit gates and then YOUR gate targets, named here as
# make goals — extension by config, never a fork of Makefile.devkit. A name
# that is not a plain make goal (whitespace, a path, a shell or make
# metacharacter) is exit 2, and `check` refuses to re-enter itself.
# [gates]
# extra = []

# --- the repo gates -----------------------------------------------------------
# `check doc` reads your ALWAYS-LOADED agent docs and verifies their claims
# resolve: dead file paths, dead `make` targets (the root Makefile plus
# whatever it includes), dead markdown links, a skill written as a flat .md.
# [doc]
# scope = ["CLAUDE.md", ".claude/rules/*.md", ".claude/agents/*.md"]
# ephemeral = ["docs/reviews/"]

# `check shell` runs shellcheck -x over every script under these roots,
# extension-less hook entry points included. It soft-skips without shellcheck.
# [shell]
# roots = ["tools"]

# `check repo-hygiene` is CLOSE-TIME and fetches from the network.
# [repo_hygiene]
# mainline = "origin/main"
# protected = "^(main|staging|archive/.*)$"

# --- the PM tree --------------------------------------------------------------
# `agentic-sdlc pm` and its drift gate `check pm`. The states are closed sets
# and the transitions are open: any value in a grain's vocabulary is reachable,
# and the gate reports a tree that contradicts itself. `pm vocabulary` prints
# the rule ids in full.
# [pm]
# roadmap_dir  = "pm/roadmap"     # the tree, relative to the repo root
# template_dir = "pm/templates"   # REQUIRED to override a grain template
# review_dir   = "docs/reviews"   # where review records live
# story_ordinal_prefix = false    # also resolve stories/NN-<slug>.md
# checks = ["D1", "D2", "D3", "D4", "D5", "D6",   # drift rules — the default
#           "V1", "V2", "V3", "V4", "V5"]         # integrity rules
#                                   # V6 (execution lists match the tree) and
#                                   # the FLOW rules are opt-in: D8 (the project
#                                   # version equals an in-progress milestone's
#                                   # id — bump-at-START), D9 (an in-progress
#                                   # milestone declares `branch:`), D10 (that
#                                   # branch is neither empty nor the mainline).
#                                   # Each reports over EVERY milestone whose
#                                   # state is in `in_progress` below.
# version_file    = "pyproject.toml"              # D8: where the version lives
# version_pattern = '^version = "(.*)"$'          # D8: the line carrying it
#                                   # A project that keeps its version in an
#                                   # framework's own file names that file
#                                   # and the line that carries it, e.g.
#                                   #   version_file    = "<its project file>"
#                                   #   version_pattern = '^<key>="(.*)"$'
#                                   # The CI workflows `install-ci` writes read
#                                   # the same fact from their own VERSION_FILE
#                                   # / VERSION_PATTERN env, at the head of
#                                   # each file — bash has no TOML reader, so
#                                   # it is written twice on purpose. Change
#                                   # one, change the other.
# The states themselves are [pm.states.<kind>] below — the one LIVE section in
# this file — and every question `pm` and `check pm` ask is asked of a state's
# CATEGORY (todo / in_progress / done), never of the word. The flat
# `<kind>_states` lists, `also_done` and `review_slug_fallback` are retired
# and refused by name: a second declaration of the same words was a second
# scoreboard, and a review record found by filename was a guess.
#
# The deprecation window that carried todo / wip / blocked / review through
# 0.24.0 is CLOSED: the stock sets are the seven words above and nothing else,
# so a grain still holding one of the four is a D4 finding. Rewrite them
# (todo -> ready, wip -> building, review -> reviewing, blocked -> building,
# recording what is blocking the work in the grain itself). Declaring your own
# set that happens to use one of those words is your vocabulary, not the
# window, and nothing here refuses it.

# --- THE FLOW — the ONE LIVE SECTION in this file -----------------------------
# Everything else here is commented at its stock default, because a GATE ships
# stock defaults and a commented default IS the default: a repo with no
# devkit.toml runs every gate byte-identically to one declaring them. **A
# WORKFLOW does not** (CLAUDE.md hard rule 5). There is NO runtime fallback
# behind the table below — the reader takes what is here and refuses BY NAME
# when it is absent — so a commented copy of this section would leave this
# freshly-initialised tree refused on its first `pm` call. That is the whole
# reason it is live, and it is the only section that has one.
#
# YOURS, and changing a word here changes no code anywhere. The tool keeps
# three opinions and no more: the category set is `todo` / `in_progress` /
# `done`, they are ordered that way, and every declared state maps to exactly
# one. How many states, what they are called, which category each sits in and
# what order they appear in within it are all this project's. A state in no
# category, or in two, is exit 2 — a fact about this file, not drift in a tree.
#
# The milestone's values reproduce the shipped lifecycle exactly; a feature
# and a story hold the subset a belt writes for them. `accepted` and
# `packaging` are `in_progress`: a category is about whether WORK REMAINS, not
# about whether the outcome is decided. A word that means FINISHED-BUT-NOT-DELIVERED
# — `obe`, `wontfix`, `duplicate` — belongs in `done`, because finished and
# delivered are different axes (`docs/design/state-categories.md` §4).
#
# THESE BYTES ARE `model.render_seed()` VERBATIM and a test holds them there.
# Hand-copying the table would leave two spellings of it in this package, and
# the copy nobody runs is the one that goes stale.

[pm.states.milestone]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing", "accepted", "packaging"]
done        = ["done", "obe"]

[pm.states.feature]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing"]
done        = ["done", "obe"]

[pm.states.story]
todo        = ["planning", "ready"]
in_progress = ["building"]
done        = ["done", "obe"]

[pm.states.bug]
todo        = ["open"]
in_progress = ["fixed"]
done        = ["closed"]

# EACH KIND DECLARES ITS OWN STATES, and the lists above are what the belts
# WRITE. `close story` claims a story (`building`) and closes it (`done`); a
# feature is additionally `reviewing` while its review record is written; a
# milestone walks all seven because acceptance and packaging are milestone
# acts. A word a kind never holds is not seeded for it. There is NO
# step-to-state table: a belt writes the FIRST state of its kind's `done`
# list, and `pm <kind> <state>` reaches any declared state by hand. A
# `[pm.transitions.<kind>]` table left over from an earlier 0.2.0 build is
# refused by name.

# --- your own gates -----------------------------------------------------------
# Everything heavier than the five gates above is this project's to supply, and
# it arrives through two seams rather than through a section here:
#
#   [gates] extra      — your own make goals, run by `make check` after the
#                        devkit roster. Static, same as the rest of `check`.
#   Makefile.tiers     — GDK_PRECOMMIT_TIERS / GDK_MILESTONE_TIERS, the target
#                        lists `precommit` and `milestone` compose from. This
#                        is where a build, a linter or a test tier
#                        belongs: it can boot, because it is not a devkit gate.
#
# A gate that reads one language's file format is a gate that
# kit owns, and it configures itself in its own section of this file.

# --- more words that mean FINISHED --------------------------------------------
# `ready-for feature` asks "is every story in the `done` CATEGORY", not "is
# every story at the word `done`" — so a story you stop working on needs a word
# in `[pm.states.story] done` or it holds its feature open forever. The seed
# lists `obe` there; add `wontfix`, `duplicate` or whatever you say. Finished
# and delivered-or-not are different axes, and only the first is a category.
